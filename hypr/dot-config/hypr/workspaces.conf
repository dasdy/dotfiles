# Auto-assign apps to workspaces
# Hyprland 0.53+ syntax. Class names verified from running clients / .desktop StartupWMClass.
# Workspace 3 is intentionally left unassigned (work-themed).

# WS1 - Browser
windowrule = workspace 1, match:class ^zen$

# WS2 - Messengers
windowrule = workspace 2, match:class ^org\.telegram\.desktop$
windowrule = workspace 2, match:class ^signal$
windowrule = workspace 2, match:class ^discord$

# WS4 - Music
windowrule = workspace 4, match:class ^spotify$

# WS5 - Gaming
windowrule = workspace 5, match:class ^steam$
windowrule = workspace 5, match:class ^net\.lutris\.Lutris$
windowrule = workspace 5, match:class ^Heroic$

# WS6 - AI
windowrule = workspace 6, match:class ^LM Studio$

# WS7 - Utilities
windowrule = workspace 7, match:class ^org\.qbittorrent\.qBittorrent$
windowrule = workspace 7, match:class ^keepassxc$
